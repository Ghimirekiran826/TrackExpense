<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f2f2;
      padding: 40px;
    }

    .container {
      width: 1020px;
      margin: auto;
      border: 2px solid #999;
      background: white;
    }

    .topbar {
      height: 70px;
      border-bottom: 2px solid #999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      font-size: 18px;
      font-weight: bold;
      background: #e9e9e9;
    }

    .top-right {
      display: flex;
      gap: 40px;
    }

    .main {
      display: flex;
      min-height: 630px;
    }

    .sidebar {
      width: 255px;
      border-right: 2px solid #999;
      background: #f7f7f7;
    }

    .menu-item {
      padding: 18px 20px;
      border-bottom: 1px solid #999;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-item.active {
      background: #dddddd;
      font-weight: bold;
    }

    .content {
      flex: 1;
      padding: 28px 26px;
    }

    .content h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .line {
      border: none;
      border-top: 2px solid #999;
      margin-bottom: 28px;
    }

    .cards {
      display: flex;
      gap: 25px;
      margin-bottom: 35px;
    }

    .card {
      width: 330px;
      border: 2px solid #aaa;
    }

    .card-header {
      padding: 12px 16px;
      font-size: 17px;
      font-weight: bold;
      border-bottom: 2px solid #aaa;
      background: #efefef;
    }

    .card-body {
      text-align: center;
      font-size: 50px;
      padding: 18px 0 22px;
      font-weight: bold;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .table-box {
      border-top: 2px solid #999;
      margin-top: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th {
      background: #efefef;
      text-align: left;
      padding: 12px 20px;
      font-size: 16px;
      border-bottom: 1px solid #999;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid #999;
    }

    .fake-line-small {
      width: 45px;
      height: 7px;
      background: #bdbdbd;
      border-radius: 3px;
    }

    .fake-line-medium {
      width: 125px;
      height: 7px;
      background: #bdbdbd;
      border-radius: 3px;
    }

    .fake-line-large {
      width: 160px;
      height: 7px;
      background: #bdbdbd;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="topbar">
      <div>System Name</div>
      <div class="top-right">
        <div>Admin</div>
        <div>Logout</div>
      </div>
    </div>

    <div class="main">
      <div class="sidebar">
        <div class="menu-item active">🖥 Dashboard</div>
        <div class="menu-item">👤 Users</div>
        <div class="menu-item">🛒 Products</div>
        <div class="menu-item">📋 Orders</div>
        <div class="menu-item">👜 Categories</div>
        <div class="menu-item">📊 Reports</div>
        <div class="menu-item">⚙ Settings</div>
        <div class="menu-item">🚪 Logout</div>
      </div>

      <div class="content">
        <h1>DASHBOARD</h1>
        <hr class="line">

        <div class="cards">
          <div class="card">
            <div class="card-header">Total Users</div>
            <div class="card-body">123</div>
          </div>

          <div class="card">
            <div class="card-header">Total Products</div>
            <div class="card-body">45</div>
          </div>
        </div>

        <div class="section-title">Recent Users</div>

        <div class="table-box">
          <table>
            <tr>
              <th style="width: 20%;">ID</th>
              <th style="width: 30%;">Name</th>
              <th>Email</th>
            </tr>

            <tr>
              <td><div class="fake-line-small"></div></td>
              <td><div class="fake-line-medium"></div></td>
              <td><div class="fake-line-large"></div></td>
            </tr>

            <tr>
              <td><div class="fake-line-small"></div></td>
              <td><div class="fake-line-small" style="width: 75px;"></div></td>
              <td><div class="fake-line-large" style="width: 195px;"></div></td>
            </tr>

            <tr>
              <td><div class="fake-line-small"></div></td>
              <td><div class="fake-line-medium"></div></td>
              <td><div class="fake-line-large"></div></td>
            </tr>

            <tr>
              <td><div class="fake-line-small"></div></td>
              <td><div class="fake-line-medium"></div></td>
              <td><div class="fake-line-large"></div></td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
